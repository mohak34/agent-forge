services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-forge-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agent-forge-redis

  minio:
    image: minio/minio:latest
    container_name: agent-forge-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agentforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agentforge123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agent-forge-api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
      - ./apps/api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agentforge:agentforge@postgres:5432/agentforge}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agent-forge-web
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  minio_data:
